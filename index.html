<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Application gratuite pour apprendre le luxembourgeois : leçons A1 à B1, entraînement infini, histoires, jeux et vraies voix du dictionnaire LOD.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Schwätz Lëtzebuergesch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column (max 560px) — header stats, tab bar, then the learning path; lessons open as a full-screen overlay. */
:root{
  --bg:#f2f6fa; --surface:#ffffff; --ink:#132030; --muted:#5a6a7c; --line:#d9e3ed;
  --red:#e0313c; --red-deep:#b8222c; --sky:#0098d6; --sky-deep:#0077a8; --sky-soft:#e0f2fb;
  --good:#1e9a52; --good-soft:#e2f5e9; --bad:#d23a3a; --bad-soft:#fde8e8; --gold:#f0b400; --gold-soft:#fff4d1;
  --lock:#c7d2dd;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141c; --surface:#16202b; --ink:#e7eef5; --muted:#92a3b5; --line:#263442;
  --red:#ff5a64; --red-deep:#d13c46; --sky:#3bb9ee; --sky-deep:#1f93c4; --sky-soft:#112f3f;
  --good:#3ccb7b; --good-soft:#123024; --bad:#ff6b6b; --bad-soft:#3a1a1d; --gold:#ffc933; --gold-soft:#3a3010;
  --lock:#33414f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d141c; --surface:#16202b; --ink:#e7eef5; --muted:#92a3b5; --line:#263442;
  --red:#ff5a64; --red-deep:#d13c46; --sky:#3bb9ee; --sky-deep:#1f93c4; --sky-soft:#112f3f;
  --good:#3ccb7b; --good-soft:#123024; --bad:#ff6b6b; --bad-soft:#3a1a1d; --gold:#ffc933; --gold-soft:#3a3010;
  --lock:#33414f; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.flag{width:30px;height:22px;border-radius:5px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr 1fr;flex:none;box-shadow:0 0 0 1px var(--line)}
.flag i:nth-child(1){background:#ed2939}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#00a1de}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.stat svg{width:18px;height:18px}
.stat.fire{color:var(--red)}.stat.xp{color:var(--sky-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat.xp{color:var(--sky)}}
:root[data-theme="dark"] .stat.xp{color:var(--sky)}

.tabs{display:flex;gap:4px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:0;white-space:nowrap;padding-inline:10px!important;border:0;background:transparent;padding:9px 4px;border-radius:12px;font-weight:700;color:var(--muted);font-size:14px;overflow-wrap:anywhere;line-height:1.2}
.rv-block{display:flex;justify-content:center;margin:-8px 0 28px}
.node.rv{gap:4px}
.node.rv .disc{background:var(--ink);box-shadow:0 6px 0 var(--muted);color:var(--bg);border-radius:20px}
.node.rv.done .disc{background:var(--gold);box-shadow:0 6px 0 #c58f00;color:#fff}
.node.rv.locked .disc{background:var(--lock);box-shadow:0 6px 0 var(--line);color:var(--muted)}
.node.rv small{font-size:12px;font-weight:700}
.res .grp{display:grid;gap:6px}
.res .grp b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.levels{margin:-8px 0 22px;display:grid;gap:10px}
.lv-head{display:flex;flex-direction:column;gap:2px}
.lv-head b{font-family:var(--f-display);font-size:17px}
.lv-head span{font-size:14px}
.lv-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{display:grid;gap:3px;justify-items:start;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:10px 11px;min-width:0}
.lv b{font-family:var(--f-display);font-size:22px;line-height:1}
.lv span{font-size:13px;font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.lv small{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lv-bar{display:block;width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.lv-bar i{display:block;height:100%;background:var(--good)}
.lv-A1 b{color:var(--red)}.lv-A2 b{color:var(--sky)}.lv-B1 b{color:var(--ink)}
.lv[aria-selected="true"]{border-color:var(--sky);background:var(--sky-soft)}
.lv-desc{margin:0;font-size:14px;color:var(--muted)}
.lv-done{margin:0;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--good)}
.lv-done svg{width:20px;height:20px;color:var(--gold)}
.res{display:grid;gap:12px}
.res .card{display:grid;gap:8px}
.res h3{font-size:18px}
.res .who{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res p{margin:0}
.res .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.res .links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;color:var(--sky-deep);background:var(--sky-soft);border-radius:10px;padding:7px 12px}
.res .links a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.res .badge-free{justify-self:start;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--good);border:1.5px solid var(--good);border-radius:6px;padding:1px 6px}
.res .badge-paid{justify-self:start;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:1px 6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .res .links a{color:var(--sky)}}
:root[data-theme="dark"] .res .links a{color:var(--sky)}
.tab[aria-selected="true"]{background:var(--sky-soft);color:var(--ink)}

main{padding-block:8px 48px}

/* Daily goal */
.goal{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
.goal .ring{width:54px;height:54px;flex:none}
.goal .txt{flex:1;min-width:0}
.goal .txt b{display:block;font-family:var(--f-display);font-size:17px}
.goal .txt span{color:var(--muted);font-size:14px}
.goal .cta{border:0;background:var(--red);color:#fff;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 3px 0 var(--red-deep);white-space:nowrap}
.goal .cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-deep)}

/* Path */
.unit{margin-bottom:28px}
.unit-head{border-radius:var(--r);padding:14px 18px;color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.unit-head small{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;opacity:.85}
.unit-head h2{font-size:21px}
.unit-head .pct{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;white-space:nowrap}
.unit:nth-child(3n+1) .unit-head{background:linear-gradient(135deg,#e0313c,#c4262f)}
.unit:nth-child(3n+2) .unit-head{background:linear-gradient(135deg,#0098d6,#0077a8)}
.unit:nth-child(3n) .unit-head{background:linear-gradient(135deg,#2c3e55,#1c2a3c)}
.nodes{display:flex;flex-direction:column;gap:14px;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0}
.node .disc{width:72px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sky);box-shadow:0 6px 0 var(--sky-deep);color:#fff;transition:transform .12s}
.node .disc svg{width:32px;height:32px}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-deep)}
.node.done .disc{background:var(--gold);box-shadow:0 6px 0 #c58f00}
.node.locked .disc{background:var(--lock);box-shadow:0 6px 0 var(--line);color:var(--muted)}
.node.locked{cursor:not-allowed}
.node.current .disc{outline:4px solid var(--sky-soft);outline-offset:4px;animation:bob 2.4s ease-in-out infinite}
.node .lbl{font-weight:700;font-size:14px;color:var(--muted)}
.node.current .lbl{color:var(--ink)}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Sheets & cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:36px 20px}
.empty h3{font-size:20px;margin-bottom:6px}

.scrim{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:85%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{font-size:22px}
.sheet .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.tip{background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:14px;font-weight:600}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;letter-spacing:.02em;text-transform:uppercase;background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sky-deep)}
.btn:disabled{background:var(--lock);box-shadow:0 4px 0 var(--line);color:var(--muted);cursor:default;transform:none}
.btn.good{background:var(--good);box-shadow:0 4px 0 #157a40}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #a52525}
.btn.ghost{background:transparent;color:var(--sky-deep);box-shadow:none;border:2px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Lesson overlay */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:12px;padding-block:14px}
.x{border:0;background:transparent;padding:6px;color:var(--muted);flex:none}
.x svg{width:24px;height:24px;display:block}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s ease}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-variant-numeric:tabular-nums}
.hearts svg{width:22px;height:22px}
.l-body{flex:1;overflow:auto;padding-block:8px 24px}
.l-body .wrap{display:flex;flex-direction:column;gap:18px}
.kind{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sky-deep);display:flex;gap:8px;align-items:center}
.kind .new{background:var(--gold);color:#3a2a00;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.prompt{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.2}
.say{display:flex;align-items:center;gap:12px}
.spk{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-deep);display:grid;place-items:center}
.spk svg{width:24px;height:24px}
.spk.big{width:96px;height:96px;border-radius:24px}
.spk.big svg{width:44px;height:44px}
.spk:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sky-deep)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:600;font-size:17px}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.opt[aria-pressed="true"] .k{border-color:var(--sky);color:var(--sky-deep)}
.opt:disabled{cursor:default}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{justify-content:center;text-align:center;font-size:16px;padding:12px 8px;min-height:56px}
.match .opt.ok{border-color:var(--good);background:var(--good-soft);opacity:.55}
.match .opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.answer-line{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 13px;font-weight:600;font-size:17px}
.tok.used{visibility:hidden}
.typein{width:100%;font:600 19px var(--f-body);padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 11px;font-weight:700}

.l-foot{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-foot .wrap{padding-block:16px;display:flex;flex-direction:column;gap:12px}
.l-foot.good{background:var(--good-soft);border-color:transparent}
.l-foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fb .ic svg{width:22px;height:22px}
.good .fb .ic{background:var(--good)}.bad .fb .ic{background:var(--bad)}
.fb b{font-family:var(--f-display);font-size:20px;display:block}
.good .fb b{color:var(--good)}.bad .fb b{color:var(--bad)}
.fb span{font-size:15px}

.result{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding-block:24px}
.result h2{font-size:32px}
.result .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.result .tile{border:2px solid var(--line);border-radius:14px;padding:10px 6px;background:var(--surface)}
.result .tile b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.result .tile small{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.badge{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;box-shadow:0 8px 0 #c58f00}
.badge svg{width:56px;height:56px}
.badge.fail{background:var(--bad);box-shadow:0 8px 0 #a52525}

/* Review */
.flash{perspective:1000px;margin:6px 0 18px}
.flash .face{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:24px}
.flash .face .w{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.15}
.flash .face .t{font-size:20px;color:var(--muted);font-weight:600}
.meter{display:flex;gap:3px}
.meter i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--good)}
.revhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}

/* Lexicon */
.search{width:100%;font:500 16px var(--f-body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:16px}
.lex h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.lex ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lex li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.lex li:first-child{border-top:0}
.lex li .lb{font-weight:700;flex:1;min-width:0}
.lex li .fr{color:var(--muted);text-align:right;min-width:0}
.lex .mini{width:34px;height:34px;border-radius:10px;border:0;background:var(--sky-soft);color:var(--sky-deep);display:grid;place-items:center;flex:none}
.lex .mini svg{width:18px;height:18px}
.voice-note{font-size:13px;color:var(--muted);margin-top:18px}
.spk.slow{width:auto;min-width:48px;padding:0 10px;background:var(--surface);color:var(--sky-deep);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.spk.slow:active{box-shadow:0 2px 0 var(--line)}
.audio{margin-bottom:16px;padding:0}
.audio summary{cursor:pointer;padding:14px 18px;font-family:var(--f-display);font-weight:700;font-size:17px}
.audio-body{display:grid;gap:10px;padding:0 18px 18px}
.audio label{font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.audio select{width:100%;font:500 15px var(--f-body);padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.audio input[type=range]{width:100%;accent-color:var(--sky)}
.audio label.rec{align-items:center;gap:12px;font-weight:500;background:var(--good-soft);border-radius:12px;padding:10px 12px}
.audio label.rec input{width:22px;height:22px;flex:none;accent-color:var(--good)}
.lex .rec-dot{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--good);border:1.5px solid var(--good);border-radius:6px;padding:1px 5px;flex:none}

.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px;font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ink);flex:none}
.welcome{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.flag.big{width:48px;height:34px;border-radius:7px}
.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt.pic{flex-direction:column;justify-content:center;min-height:110px;position:relative}
.opt.pic .k{position:absolute;top:8px;left:8px}
.opt.pic .emo{font-size:52px;line-height:1}
.blank{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--sky);color:transparent}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.norec{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.recbox{display:grid;gap:8px;width:100%}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.recbtn:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.bubble{max-width:86%;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface);display:grid;gap:4px;animation:up .2s ease-out}
.bubble.l{align-self:flex-start;border-bottom-left-radius:4px}
.bubble.r{align-self:flex-end;border-bottom-right-radius:4px;background:var(--sky-soft);border-color:transparent}
.bubble small{font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.bubble p{margin:0;font-size:17px;font-weight:600}
.bubble .trl{font-weight:500;font-size:15px;color:var(--muted)}
.brow{display:flex;gap:8px;align-items:center}
.mini2{width:32px;height:32px;border-radius:9px;border:0;background:var(--sky);color:#fff;display:grid;place-items:center}
.mini2 svg{width:17px;height:17px}
.trbtn{border:0;background:transparent;color:var(--sky-deep);font-weight:700;font-size:14px;padding:4px 2px;text-decoration:underline}
.prac{display:grid;gap:26px}
.prac h2{font-size:22px}
.prac section>p{margin:4px 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pcard{display:grid;gap:4px;justify-items:start;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:16px;padding:14px;min-width:0}
.pcard b{font-family:var(--f-display);font-size:18px}
.pcard .muted{font-size:14px}
.pcard small{font-size:12.5px;font-weight:700;color:var(--muted)}
.pcard.wide{width:100%}
.pcard:active{transform:translateY(2px)}
.gico{font-size:28px}
.lvpill{font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;border:1.5px solid currentColor}
.lvpill.lv-A1{color:var(--red)}.lvpill.lv-A2{color:var(--sky-deep)}.lvpill.lv-B1{color:var(--ink)}
.gstat{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.face.flash-good{animation:fg .35s}.face.flash-bad{animation:shake .3s}
@keyframes fg{50%{border-color:var(--good);background:var(--good-soft)}}
.inf{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--sky);border-radius:var(--r);padding:14px 16px;margin:-8px 0 22px}
.inf-txt{flex:1;min-width:0;display:grid;gap:2px}
.inf-txt b{font-family:var(--f-display);font-size:18px}
.inf-txt b span{color:var(--sky);font-size:22px}
.inf-txt span{font-size:14px;color:var(--muted)}
.inf-txt small{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.inf .cta{background:var(--sky);box-shadow:0 3px 0 var(--sky-deep)}
@media (max-width:420px){.inf{flex-direction:column;align-items:stretch}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.prompt{font-size:22px}.brand b{font-size:16px}.stat{padding:4px 8px}}

 tip:{u0l0:"“Moien” is used all day long, from morning to evening. It's the most common greeting in Luxembourg, with friends and at the counter alike.",
  u0l1:"To thank someone warmly, say “Villmools merci”. To say goodbye: “Äddi, bis geschwënn!”",
  u1l0:"The verb “heeschen” (to be called): ech heeschen, du heeschs, hien / si heescht.",
  u1l1:"The Eifel rule: the final -n drops before most consonants. You say “e bësse Lëtzebuergesch” but “e bëssen Englesch”. The -n stays before a vowel and before n, d, t, z, h.",
  u2l0:"Before a feminine noun, “zwee” becomes “zwou”: zwou Schwësteren (two sisters).",
  u2l1:"To ask someone's age: “Wéi al bass du?”. Answer: “Ech sinn … Joer al”.",
  u3l0:"The definite article: de (masculine), d' (feminine, neuter and plural). E.g. de Papp, d'Mamm, d'Kand.",
  u3l1:"“My”: mäi before a masculine or neuter noun, meng before a feminine or plural noun. Mäi Brudder, meng Mamm.",
  u4l0:"“Ech hätt gär…” means “I would like…”. Very handy at the café or the bakery.",
  u4l1:"“Gromperekichelcher” (potato fritters) are the speciality of Christmas markets and village fairs.",
  u5l0:"After “ass”, the adjective doesn't change: den Auto ass rout, d'Haus ass rout.",
  u6l0:"To say “on Monday”: um Méindeg. “Haut ass Freideg” = “Today is Friday”.",
  u6l1:"haut = today, muer = tomorrow, gëschter = yesterday. The past of “ass” is “war”.",
  u7l0:"Public transport has been free in Luxembourg since 2020: a great way to practise “Ech huelen de Bus”.",
  u8l0:"“zu” is used for towns and the country: zu Lëtzebuerg, zu Esch. To be inside a place: an der Kichen (in the kitchen), am Gaart (in the garden).",
  u8l1:"After “an”: an der for a feminine noun (an der Kichen), am for a masculine or neuter noun (am Gaart, am Zëmmer).",
  u9l0:"Like “it rains” in English, you use “et”: et reent (it's raining), et schneit (it's snowing).",
  u9l1:"The Eifel rule also applies to “hunn”: ech hunn eng Schwëster, but ech hu gär de Summer.",
  u10l0:"“Auer” is feminine: et ass eng Auer, zwou Auer, dräi Auer. “Hallwer” counts towards the next hour: hallwer dräi = 2:30.",
  u11l0:"At work, Luxembourgish borrows a lot from French: de Bureau, de Chef, de Rendez-vous, d'Reunioun.",
  u12l0:"“Wéi vill kascht dat?” = “How much does it cost?”. In shops you pay at the Keess (checkout).",
  u13l0:"“gär” after the verb means “to like doing”: ech liese gär (I like reading), ech kache gär (I like cooking).",
  u14l0:"“… deet wéi” = “… hurts”: mäi Kapp deet wéi (I have a headache). Emergency number in Luxembourg: 112."},

 tip:{u0l0:"«Moien» usa-se durante todo o dia, de manhã à noite. É o cumprimento mais comum no Luxemburgo, entre amigos ou num balcão.",
  u0l1:"Para agradecer calorosamente, diz «Villmools merci». Para te despedires: «Äddi, bis geschwënn!»",
  u1l0:"O verbo «heeschen» (chamar-se): ech heeschen, du heeschs, hien / si heescht.",
  u1l1:"Regra do Eifel: o -n final cai antes da maioria das consoantes. Diz-se «e bësse Lëtzebuergesch» mas «e bëssen Englesch». O -n mantém-se antes de vogal e de n, d, t, z, h.",
  u2l0:"Antes de um nome feminino, «zwee» passa a «zwou»: zwou Schwësteren (duas irmãs).",
  u2l1:"Para perguntar a idade: «Wéi al bass du?». Resposta: «Ech sinn … Joer al».",
  u3l0:"O artigo definido: de (masculino), d' (feminino, neutro e plural). Ex.: de Papp, d'Mamm, d'Kand.",
  u3l1:"«Meu / minha»: mäi antes de nome masculino ou neutro, meng antes de nome feminino ou plural. Mäi Brudder, meng Mamm.",
  u4l0:"«Ech hätt gär…» quer dizer «Queria…». Muito útil no café ou na padaria.",
  u4l1:"Os «Gromperekichelcher» (bolinhos de batata) são a especialidade dos mercados de Natal e das festas de aldeia.",
  u5l0:"Depois de «ass», o adjetivo não muda: den Auto ass rout, d'Haus ass rout.",
  u6l0:"Para dizer «na segunda-feira»: um Méindeg. «Haut ass Freideg» = «Hoje é sexta-feira».",
  u6l1:"haut = hoje, muer = amanhã, gëschter = ontem. O passado de «ass» é «war».",
  u7l0:"Os transportes públicos são gratuitos no Luxemburgo desde 2020: ótimo para praticar «Ech huelen de Bus».",
  u8l0:"«zu» usa-se para cidades e para o país: zu Lëtzebuerg, zu Esch. Para estar dentro de um lugar: an der Kichen (na cozinha), am Gaart (no jardim).",
  u8l1:"Depois de «an»: an der para nome feminino (an der Kichen), am para nome masculino ou neutro (am Gaart, am Zëmmer).",
  u9l0:"Para falar do tempo usa-se «et»: et reent (está a chover), et schneit (está a nevar).",
  u9l1:"A regra do Eifel também se aplica a «hunn»: ech hunn eng Schwëster, mas ech hu gär de Summer.",
  u10l0:"«Auer» é feminino: et ass eng Auer, zwou Auer, dräi Auer. «Hallwer» conta para a hora seguinte: hallwer dräi = 2h30.",
  u11l0:"No trabalho, o luxemburguês usa muitas palavras francesas: de Bureau, de Chef, de Rendez-vous, d'Reunioun.",
  u12l0:"«Wéi vill kascht dat?» = «Quanto custa?». Nas lojas paga-se na Keess (caixa).",
  u13l0:"«gär» depois do verbo quer dizer «gostar de»: ech liese gär (gosto de ler), ech kache gär (gosto de cozinhar).",
  u14l0:"«… deet wéi» = «… dói»: mäi Kapp deet wéi (dói-me a cabeça). Número de emergência no Luxemburgo: 112."},

 tip:{u0l0:"„Moien“ sagt man den ganzen Tag, von morgens bis abends. Es ist der häufigste Gruß in Luxemburg, unter Freunden wie am Schalter.",
  u0l1:"Um herzlich zu danken, sag „Villmools merci“. Zum Abschied: „Äddi, bis geschwënn!“",
  u1l0:"Das Verb „heeschen“ (heißen): ech heeschen, du heeschs, hien / si heescht.",
  u1l1:"Eifeler Regel: Das End-n fällt vor den meisten Konsonanten weg. Man sagt „e bësse Lëtzebuergesch“, aber „e bëssen Englesch“. Das -n bleibt vor Vokalen und vor n, d, t, z, h.",
  u2l0:"Vor einem weiblichen Nomen wird „zwee“ zu „zwou“: zwou Schwësteren (zwei Schwestern).",
  u2l1:"Nach dem Alter fragen: „Wéi al bass du?“. Antwort: „Ech sinn … Joer al“.",
  u3l0:"Der bestimmte Artikel: de (männlich), d' (weiblich, sächlich und Plural). Z. B. de Papp, d'Mamm, d'Kand.",
  u3l1:"„Mein / meine“: mäi vor männlichen oder sächlichen Nomen, meng vor weiblichen Nomen oder im Plural. Mäi Brudder, meng Mamm.",
  u4l0:"„Ech hätt gär…“ heißt „Ich hätte gern…“. Sehr praktisch im Café oder in der Bäckerei.",
  u4l1:"„Gromperekichelcher“ (Kartoffelpuffer) sind die Spezialität der Weihnachtsmärkte und Dorffeste.",
  u5l0:"Nach „ass“ bleibt das Adjektiv unverändert: den Auto ass rout, d'Haus ass rout.",
  u6l0:"„Am Montag“ heißt um Méindeg. „Haut ass Freideg“ = „Heute ist Freitag“.",
  u6l1:"haut = heute, muer = morgen, gëschter = gestern. Die Vergangenheit von „ass“ ist „war“.",
  u7l0:"Öffentliche Verkehrsmittel sind in Luxemburg seit 2020 kostenlos: ideal, um „Ech huelen de Bus“ zu üben.",
  u8l0:"„zu“ steht bei Städten und beim Land: zu Lëtzebuerg, zu Esch. Für „in einem Raum“: an der Kichen (in der Küche), am Gaart (im Garten).",
  u8l1:"Nach „an“: an der bei weiblichen Nomen (an der Kichen), am bei männlichen oder sächlichen (am Gaart, am Zëmmer).",
  u9l0:"Wie im Deutschen „es regnet“ benutzt man „et“: et reent (es regnet), et schneit (es schneit).",
  u9l1:"Die Eifeler Regel gilt auch für „hunn“: ech hunn eng Schwëster, aber ech hu gär de Summer.",
  u10l0:"„Auer“ ist weiblich: et ass eng Auer, zwou Auer, dräi Auer. „Hallwer“ zählt zur nächsten Stunde: hallwer dräi = halb drei (2:30).",
  u11l0:"Bei der Arbeit leiht sich das Luxemburgische viel aus dem Französischen: de Bureau, de Chef, de Rendez-vous, d'Reunioun.",
  u12l0:"„Wéi vill kascht dat?“ = „Wie viel kostet das?“. Im Geschäft zahlt man an der Keess (Kasse).",
  u13l0:"„gär“ nach dem Verb heißt „gern“: ech liese gär (ich lese gern), ech kache gär (ich koche gern).",
  u14l0:"„… deet wéi“ = „… tut weh“: mäi Kapp deet wéi (mir tut der Kopf weh). Notruf in Luxemburg: 112."},

 tip:{u15l0:"The past is formed with “hunn” or “sinn” + the participle at the end: Ech hunn e Film gesinn. Verbs of movement take “sinn”: Mir sinn an d'Stad gaangen.",
  u16l0:"With “kënnen” (can), the second verb goes to the end: Kann ech mat der Kaart bezuelen?",
  u17l0:"Some verbs split: opstoen → ech stinn … op. The particle “op” goes to the end of the sentence.",
  u18l0:"“fueren” = to go by vehicle (car, train, bus); “goen” = to go on foot. “Wéini?” = when?",
  u19l0:"“well” (because) sends the verb to the end: Ech si frou, well et Weekend ass.",
  u20l0:"“Dir” is the polite form of you, with “Är” for your: Wat ass Är Adress? At the town hall people almost always use the polite form.",
  u21l0:"After “dass” (that) and “well” (because), the conjugated verb goes to the end: Ech mengen, dass et muer reent.",
  u22l0:"“ufänken” (to start) splits: d'Aarbecht fänkt um aacht Auer un. Speaking Luxembourgish is a real plus in a job interview.",
  u23l0:"“géif” + infinitive = conditional: ech géif kommen (I would come). After “wann” (if), the verb goes to the end, and the next clause starts with the verb: Wann ech Zäit hätt, géif ech…",
  u24l0:"Since the 1984 law, Luxembourgish is the national language. French, German and Luxembourgish are the three administrative languages.",
  u25l0:"The passive uses “ginn” + participle: Den Offall gëtt recycléiert (the waste is recycled)."},

 tip:{u15l0:"O passado forma-se com «hunn» ou «sinn» + o particípio no fim: Ech hunn e Film gesinn. Os verbos de movimento usam «sinn»: Mir sinn an d'Stad gaangen.",
  u16l0:"Com «kënnen» (poder), o segundo verbo vai para o fim: Kann ech mat der Kaart bezuelen?",
  u17l0:"Alguns verbos separam-se: opstoen → ech stinn … op. A partícula «op» vai para o fim da frase.",
  u18l0:"«fueren» = ir de transporte (carro, comboio, autocarro); «goen» = ir a pé. «Wéini?» = quando?",
  u19l0:"«well» (porque) manda o verbo para o fim: Ech si frou, well et Weekend ass.",
  u20l0:"«Dir» é a forma educada (o senhor / a senhora), com «Är» para seu/sua: Wat ass Är Adress? Na comuna usa-se quase sempre a forma educada.",
  u21l0:"Depois de «dass» (que) e «well» (porque), o verbo conjugado vai para o fim: Ech mengen, dass et muer reent.",
  u22l0:"«ufänken» (começar) separa-se: d'Aarbecht fänkt um aacht Auer un. Falar luxemburguês é uma grande vantagem numa entrevista de emprego.",
  u23l0:"«géif» + infinitivo = condicional: ech géif kommen (eu viria). Depois de «wann» (se), o verbo vai para o fim e a frase seguinte começa pelo verbo: Wann ech Zäit hätt, géif ech…",
  u24l0:"Desde a lei de 1984, o luxemburguês é a língua nacional. O francês, o alemão e o luxemburguês são as três línguas administrativas.",
  u25l0:"A voz passiva forma-se com «ginn» + particípio: Den Offall gëtt recycléiert (o lixo é reciclado)."},

 tip:{u15l0:"Das Perfekt bildet man mit „hunn“ oder „sinn“ + Partizip am Ende: Ech hunn e Film gesinn. Verben der Bewegung nehmen „sinn“: Mir sinn an d'Stad gaangen.",
  u16l0:"Mit „kënnen“ (können) steht das zweite Verb am Ende: Kann ech mat der Kaart bezuelen?",
  u17l0:"Manche Verben sind trennbar: opstoen → ech stinn … op. Die Partikel „op“ steht am Satzende.",
  u18l0:"„fueren“ = mit einem Fahrzeug fahren; „goen“ = zu Fuß gehen. „Wéini?“ = wann?",
  u19l0:"„well“ (weil) schickt das Verb ans Ende: Ech si frou, well et Weekend ass.",
  u20l0:"„Dir“ ist die Höflichkeitsform (Sie), dazu „Är“ (Ihr): Wat ass Är Adress? Auf der Gemeinde siezt man fast immer.",
  u21l0:"Nach „dass“ und „well“ (weil) steht das konjugierte Verb am Ende: Ech mengen, dass et muer reent.",
  u22l0:"„ufänken“ (anfangen) ist trennbar: d'Aarbecht fänkt um aacht Auer un. Luxemburgisch zu sprechen ist im Vorstellungsgespräch ein echter Vorteil.",

}

function bare(s){return norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/'/g,"")}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{const n=voices.length;loadVoices();if(view==="lex"&&n!==voices.length&&!$("#layer").innerHTML)renderLex()}}
const isLbV=v=>/^lb|ltz/i.test(v.lang)||/\b(mia|mil)\b|luxemb|lëtzebuerg/i.test(v.name);
function lbVoice(){return voices.find(isLbV)||null}
const GOODV=/premium|enhanced|amélior|natural|neural|online|google|siri/i;
function vScore(v){return (isLbV(v)?100:0)+(/LU|CH/i.test(v.lang)?3:0)+(GOODV.test(v.name)?20:0)+(/^de[-_]DE/i.test(v.lang)?2:0)}
function voiceList(){return voices.filter(v=>isLbV(v)||/^de/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a))}
function pickVoice(){return (S.voice&&voices.find(v=>v.name===S.voice))||voiceList()[0]||null}
/* Une voix allemande lit mal certaines graphies luxembourgeoises : on les réécrit à la façon allemande. */
function respell(t){
  return t.replace(/[’]/g,"'")
    .replace(/éi/g,"äi").replace(/É/g,"E").replace(/é/g,"e")
    .replace(/ë/g,"e").replace(/Ë/g,"E")
    .replace(/(^|[^aeiouäö])ie/gi,"$1ia").replace(/(^|[^aeiouäö])ue/g,"$1ua").replace(/Ue/g,"Ua")
    .replace(/(^|[^v])ou/g,"$1au").replace(/(^|\s)Ou/g,"$1Au");

let L=null;
function buildExercises(l){
  const W=l.words.map(w=>({lb:w[0],fr:w[1]})), seen=new Set(Object.keys(S.str));
  const ex=[];
  shuffle(W).forEach((w,i)=>ex.push({t:"mcq",dir:i%3===2?"fr2lb":"lb2fr",w,fresh:!seen.has(w.lb)}));
  ex.splice(Math.min(4,ex.length),0,{t:"match",pairs:shuffle(W).slice(0,5)});
  const canListen="speechSynthesis" in window||Object.keys(AUDIO).length>0;
  shuffle(W.filter(w=>canHear(w.lb))).slice(0,1).forEach(w=>ex.push({t:"listen",w}));
  shuffle(W.filter(w=>EMOJI[w.lb])).slice(0,2).forEach(w=>ex.push({t:"pic",w}));
  const S2=shuffle(l.sent).map(s=>({lb:s[0],fr:s[1]}));
  S2.forEach((s,i)=>ex.push(i===0&&toks(s.lb).length>=3?{t:"gap",s}:{t:"build",s}));
  if(S2[1]) ex.push({t:"build",s:S2[0]});
  { const sp=S2.filter(s=>canHear(s.lb)); if(sp.length) ex.push({t:"speak",s:pick(sp)}); }
  shuffle(W.filter(w=>w.lb.length<=16)).slice(0,1).forEach(w=>ex.push({t:"type",w}));
  {const d=shuffle(W.filter(w=>w.lb.length<=16&&hasRec(w.lb)&&S.useRec!==false));if(d[0]) ex.push({t:"dict",w:d[0]});}
  const head=ex.slice(0,5), tail=shuffle(ex.slice(5));

let lexQ="";
function renderLex(){
  const vl=voiceList(), pv=pickVoice();
  $("#main").innerHTML=`<details class="card audio" id="audio" ${S.audioOpen!==false?"open":""}><summary>${esc(t("voiceSpeed"))}</summary>
     <div class="audio-body">
      <label class="rec"><span><b>${esc(t("lodRec"))}</b><br><span class="muted" style="font-weight:500">${esc(t("lodRecP",{n:Object.keys(AUDIO).length}))}</span></span><input type="checkbox" id="vrec" ${S.useRec!==false?"checked":""}></label>
      <label class="rec"><span><b>${esc(t("ttsOpt"))}</b><br><span class="muted" style="font-weight:500">${esc(t("ttsOptP"))}</span></span><input type="checkbox" id="vtts" ${S.useTTS?"checked":""}></label>
      <label for="vsel">${esc(t("sentVoice"))}</label>
      <select id="vsel">${vl.length?vl.map(v=>`<option value="${esc(v.name)}" ${pv&&v.name===pv.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})${isLbV(v)||GOODV.test(v.name)?" ★":""}</option>`).join(""):`<option value="">${esc(t("noVoice"))}</option>`}</select>
      <label for="vrate">${esc(t("speed"))} <span id="vrv">${Math.round((S.rate||.8)*100)} %</span></label>
      <input type="range" id="vrate" min="0.5" max="1.1" step="0.05" value="${S.rate||.8}">
      <div class="row2"><button class="btn ghost" id="vtest-slow">${esc(t("testSlow"))}</button><button class="btn" id="vtest">${esc(t("test"))}</button></div>
      <p class="voice-note" style="margin:0">${esc(lbVoice()?t("hasLb"):t("noLb"))}</p>
      <div class="tip" style="margin:0"><b>${esc(t("miaT"))}</b>${esc(t("miaP"))}</div>
     </div></details>
   <input class="search" id="lexq" type="search" placeholder="${esc(t("search"))}" aria-label="${esc(t("search"))}" value="${esc(lexQ)}"><div class="lex" id="lexl"></div>`;
  const q=$("#lexq"); q.oninput=()=>{lexQ=q.value;drawLex()}; drawLex();
  $("#audio").ontoggle=()=>{S.audioOpen=$("#audio").open;save()};
  $("#vtts").onchange=e=>{S.useTTS=e.target.checked;save()};
  $("#vrec").onchange=e=>{S.useRec=e.target.checked;save();speak("Moien")};
  $("#vsel").onchange=e=>{S.voice=e.target.value||null;save();speak("Moien, wéi geet et?")};
  $("#vrate").oninput=e=>{S.rate=+e.target.value;$("#vrv").textContent=Math.round(S.rate*100)+" %";save()};
  $("#vtest").onclick=()=>speak("Moien, ech schwätzen e bësse Lëtzebuergesch.");
  $("#vtest-slow").onclick=()=>speak("Moien, ech schwätzen e bësse Lëtzebuergesch.",true);
}
function drawLex(){
  const f=bare(lexQ); let h="";
  UNITS.forEach((u,ui)=>{
    const ws=u.lessons.flatMap(l=>l.words).filter(w=>!f||bare(w[0]).includes(f)||bare(w[1]).includes(f));
    if(!ws.length)return;
    h+=`<h3>${u.level} · ${esc(u.sub)}</h3><ul>${ws.map(w=>`<li><button class="mini" data-s="${esc(w[0])}" aria-label="${esc(t("listen"))} ${esc(w[0])}">${ICON.spk}</button><span class="lb">${esc(w[0])}</span>${audioId(w[0])?`<span class="rec-dot" title="${esc(t("lodTitle"))}">LOD</span>`:""}<span class="fr">${esc(w[1])}</span></li>`).join("")}</ul>`;
  });
  h = h ? h+`<p class="voice-note">${esc(t("lodNote"))}</p>` : `<p class="muted">${esc(t("noMatch",{q:lexQ}))}</p>`;
  $("#lexl").innerHTML=h;
  $("#lexl").querySelectorAll(".mini").forEach(b=>b.onclick=()=>speak(b.dataset.s));
}

const REC=()=>`<div class="recbox"><label class="btn ghost recbtn"><span aria-hidden="true">🎙️</span> ${esc(t("recBtn"))}<input type="file" accept="audio/*" capture="user" class="recin" hidden></label>
  <div class="recplay row2" hidden><button class="btn ghost" data-r="mine">${esc(t("mine"))}</button><button class="btn" data-r="cmp">${esc(t("compare"))}</button></div>
  <p class="voice-note recnote" style="margin:0">${esc(t("recHint"))}</p></div>`;
let recURL=null, recAu=null;
function bindRecorder(root,text){
  const inp=root.querySelector(".recin"); if(!inp) return;
  const note=root.querySelector(".recnote");
  const playMine=()=>{ if(!recAu) return; try{curAudio&&curAudio.pause();speechSynthesis.cancel()}catch(e){} recAu.currentTime=0; const p=recAu.play(); if(p&&p.catch) p.catch(()=>{note.textContent=t("recFail")}); };
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    if(recURL) URL.revokeObjectURL(recURL); recURL=URL.createObjectURL(f); recAu=new Audio(recURL); recAu.onerror=()=>{note.textContent=t("recFail")};
    root.querySelector(".recplay").hidden=false; playMine(); };
  root.querySelector('[data-r="mine"]').onclick=playMine;
  root.querySelector('[data-r="cmp"]').onclick=()=>{ lastSpeak.at=0; speak(text); setTimeout(()=>{ const a=curAudio; let done=false; const then=()=>{ if(done) return; done=true; setTimeout(playMine,350) };
    if(a){ a.addEventListener("ended",then); a.addEventListener("pause",then) } else setTimeout(then,2600) },80); };
}

let GT=null; // minuteur des jeux
const _closeLayer=closeLayer;
closeLayer=function(){ if(GT){clearInterval(GT);GT=null} _closeLayer(); };
function addXP(g){
  S.xp+=g; const d=today(); if(S.day.d!==d) S.day={d,xp:0}; S.day.xp+=g;
  const y=new Date(Date.now()-864e5).toLocaleDateString("sv");
  if(S.last!==d){ S.streak=(S.last===y?S.streak:0)+1; S.last=d; } save(); header();
}
function practiceWords(){
  const lw=learnedWords(); const src=lw.length>=10?lw:ALLWORDS.filter(w=>LESSONS.find(l=>l.id===w.lesson)?.level==="A1");
  const seen=new Set(); return src.filter(w=>{if(seen.has(w.fr))return false;seen.add(w.fr);return true});
}
function shell(inner,foot){
  $("#layer").innerHTML=`<div class="lesson" role="dialog" aria-modal="true">
   <div class="wrap l-top"><button class="x" id="pq" aria-label="${esc(t("back"))}">${ICON.x}</button><div class="bar"><i id="bar" style="width:0"></i></div><span class="hearts" id="ptag"></span></div>
   <div class="l-body"><div class="wrap" id="pbody">${inner}</div></div>
   <footer class="l-foot" id="foot"><div class="wrap" id="pfoot">${foot||""}</div></footer></div>`;
  $("#pq").onclick=()=>{closeLayer();render()};
  document.onkeydown=ev=>{if(ev.key==="Escape"){closeLayer();render()}};
}
function resultScreen(title,big,sub,again){
  $("#layer").querySelector(".lesson").innerHTML=`<div class="wrap result"><div class="badge">${ICON.star}</div><h2>${esc(title)}</h2>
   <div class="tiles" style="grid-template-columns:1fr"><div class="tile"><small>${esc(t("score"))}</small><b>${esc(big)}</b></div></div>
   ${sub?`<p class="muted" style="margin:0">${esc(sub)}</p>`:""}
   <div style="display:grid;gap:10px;width:100%">${again?`<button class="btn" id="r-again">${esc(t("again2"))}</button>`:""}<button class="btn ghost" id="r-back">${esc(t("back"))}</button></div></div>`;
  if(again) $("#r-again").onclick=again; $("#r-back").onclick=()=>{closeLayer();render()}; ($("#r-again")||$("#r-back")).focus();
}

/* Histoire : répliques une à une, puis questions */
function playStory(st){
  let i=0, q=-1, ok=0; const total=st.lines.length+st.qs.length;
  shell(`<div class="kind">${esc(st.level)} · ${esc(st.sub[LANG]||st.sub.fr)}</div><h2 style="font-size:26px">${esc(st.title)}</h2><div class="chat" id="chat"></div><div id="sq"></div>`,
        `<button class="btn" id="snext">${esc(t("cont"))}</button>`);
  const chat=$("#chat"), speakers=[...new Set(st.lines.map(l=>l[0]))];
  const bar=()=>{$("#bar").style.width=Math.round(100*(i+Math.max(0,q))/total)+"%"};
  function addLine(){
    const [sp,lb,trs]=st.lines[i], side=speakers.indexOf(sp)%2?"r":"l";
    const d=document.createElement("div"); d.className="bubble "+side;
    d.innerHTML=`<small>${esc(sp)}</small><p>${esc(lb)}</p><div class="brow">${canHear(lb)?`<button class="mini2" data-a="say" aria-label="${esc(t("listen"))}">${ICON.spk}</button>`:""}<button class="trbtn" data-a="tr">${esc(t("showTrS"))}</button></div><p class="trl" hidden>${esc(trs[LANG]||trs.fr)}</p>`;
    const sb=d.querySelector('[data-a="say"]'); if(sb) sb.onclick=()=>speak(lb);
    d.querySelector('[data-a="tr"]').onclick=()=>{const p=d.querySelector(".trl");p.hidden=!p.hidden};
    chat.appendChild(d); speak(lb); i++; bar(); d.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  function showQ(){
    const [qlb,qtr,opts]=st.qs[q], correct=opts[0], ch=shuffle(opts);
    $("#sq").innerHTML=`<div class="kind" style="margin-top:18px">${esc(t("storyQ"))} · ${q+1}/${st.qs.length}</div><div class="prompt" style="font-size:22px">${esc(qlb)}</div><p class="muted" style="margin:0">${esc(qtr[LANG]||qtr.fr)}</p>
      <div class="opts" style="margin-top:10px">${ch.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${esc(o)}</button>`).join("")}</div>`;
    $("#snext").disabled=true; $("#foot").className="l-foot";
    $("#sq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const v=ch[+b.dataset.k], good=v===correct; if(good) ok++; beep(good);
      $("#sq").querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(ch[+x.dataset.k]===correct) x.classList.add("right")});
      if(!good) b.classList.add("wrong");
      $("#foot").className="l-foot "+(good?"good":"bad"); $("#snext").disabled=false; $("#snext").focus(); speak(correct);
    });
    $("#sq").scrollIntoView({block:"start",behavior:"smooth"});
  }
  $("#snext").onclick=()=>{
    if(i<st.lines.length){ addLine(); return; }
    q++; bar();
    if(q<st.qs.length){ showQ(); return; }
    const first=!S.stories?.[st.id]; S.stories=S.stories||{}; S.stories[st.id]=Math.max(S.stories[st.id]||0,ok);
    addXP(first?15:5);
    resultScreen(t("storyDone"),`${ok}/${st.qs.length}`,`+${first?15:5} XP`,()=>playStory(st));
  };
  addLine();
}

/* Jeu : chrono-paires */
function gamePairs(){
  const pool=practiceWords(); let score=0, left=60, sel=null;
  shell(`<div class="kind">${esc(t("gPairs"))}</div><div class="gstat"><span>${esc(t("score"))}: <b id="gsc">0</b></span><span><b id="gtm">60</b> s</span></div><div class="match" id="gb"></div>`);
  $("#ptag").textContent="⏱";
  function deal(){
    const ws=shuffle(pool).slice(0,5), L1=shuffle(ws), R1=shuffle(ws);
    $("#gb").innerHTML=`<div class="col">${L1.map(w=>`<button class="opt" data-s="l" data-k="${esc(w.lb)}">${esc(w.lb)}</button>`).join("")}</div><div class="col">${R1.map(w=>`<button class="opt" data-s="r" data-k="${esc(w.lb)}">${esc(w.fr)}</button>`).join("")}</div>`;
    let n=0; sel=null;
    $("#gb").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("ok")) return;
      if(b.dataset.s==="l"){ $("#gb").querySelectorAll('[data-s="l"]').forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel=b; return; }
      if(!sel) return;
      if(sel.dataset.k===b.dataset.k){ [sel,b].forEach(x=>{x.classList.add("ok");x.disabled=true;x.setAttribute("aria-pressed","false")}); sel=null; score++; n++; $("#gsc").textContent=score; beep(true); if(n===5) setTimeout(deal,250); }
      else { [sel,b].forEach(x=>{x.classList.remove("no");void x.offsetWidth;x.classList.add("no")}); beep(false); }
    });
  }
  deal();
  GT=setInterval(()=>{ left--; const el=$("#gtm"); if(el) el.textContent=left; $("#bar").style.width=(100*(60-left)/60)+"%";
    if(left<=0){ clearInterval(GT); GT=null; endGame("pairs",score,gamePairs); } },1000);
}
/* Jeu : vrai ou faux */
function gameTF(){
  const pool=practiceWords(); let score=0, left=45, cur2=null;
  shell(`<div class="kind">${esc(t("gTF"))}</div><div class="gstat"><span>${esc(t("score"))}: <b id="gsc">0</b></span><span><b id="gtm">45</b> s</span></div>
    <div class="flash"><div class="face" id="tfcard"></div></div>
    <div class="row2"><button class="btn bad" id="tfn">${esc(t("no"))}</button><button class="btn good" id="tfy">${esc(t("yes"))}</button></div>`);
  $("#ptag").textContent="⏱";
  function nextQ(){
    const w=pick(pool), real=Math.random()<.5; let shown=w.fr;
    if(!real){ const o=pool.filter(x=>x.fr!==w.fr); if(o.length) shown=pick(o).fr; }
    cur2={w,truth:shown===w.fr};
    $("#tfcard").innerHTML=`<div class="w">${esc(w.lb)}</div><div class="t">= ${esc(shown)} ?</div>`;
  }
  function ans(v){ if(!cur2) return; const good=v===cur2.truth; if(good){score++;$("#gsc").textContent=score} beep(good);
    const c=$("#tfcard"); c.classList.remove("flash-good","flash-bad"); void c.offsetWidth; c.classList.add(good?"flash-good":"flash-bad"); nextQ(); }
  $("#tfy").onclick=()=>ans(true); $("#tfn").onclick=()=>ans(false);
  document.onkeydown=ev=>{ if(ev.key==="ArrowRight"||ev.key==="v") ans(true); if(ev.key==="ArrowLeft"||ev.key==="f") ans(false); if(ev.key==="Escape"){closeLayer();render()} };
  nextQ();
  GT=setInterval(()=>{ left--; const el=$("#gtm"); if(el) el.textContent=left; $("#bar").style.width=(100*(45-left)/45)+"%";
    if(left<=0){ clearInterval(GT); GT=null; cur2=null; endGame("tf",score,gameTF); } },1000);
}
function endGame(key,score,again){
  S.best=S.best||{}; const rec=score>(S.best[key]||0); if(rec) S.best[key]=score;
  const g=Math.min(15,Math.round(score/2)); if(g) addXP(g); else save();
  document.onkeydown=null;
  resultScreen(rec&&score?t("newBest"):t("timeUp"),String(score),`${t("best",{n:S.best[key]||0})}${g?` · +${g} XP`:""}`,again);
}
/* Parler : phrases à écouter et répéter */
function speakPractice(){
  const ids=new Set(Object.keys(S.done));
  let pool=LESSONS.filter(l=>!l.review&&ids.has(l.id)).flatMap(l=>l.sent);
  pool=pool.filter(s=>canHear(s[0]));
  if(pool.length<5) pool=LESSONS.filter(l=>!l.review&&l.level==="A1").flatMap(l=>l.sent).filter(s=>canHear(s[0]));
  pool=shuffle(pool); let i=0;
  shell(`<div class="kind">${esc(t("speakT"))}</div><div class="flash"><div class="face" id="spcard"></div></div><div class="tip" style="margin:0">${esc(t("speakNote"))}</div>`,
        `<button class="btn" id="spn">${esc(t("nextS"))}</button>`);
  $("#ptag").textContent="🗣";
  function show(){ const s=pool[i%pool.length]; $("#bar").style.width=Math.min(100,(i%10+1)*10)+"%";
    $("#spcard").innerHTML=`<div style="display:flex;gap:10px"><button class="spk" id="sps" aria-label="${esc(t("listen"))}">${ICON.spk}</button>${SLOWB()}</div><div class="w" style="font-size:26px">${esc(s[0])}</div><button class="trbtn" id="spt">${esc(t("showTrS"))}</button><div class="t" id="sptr" hidden>${esc(s[1])}</div>${REC()}`;
    $("#sps").onclick=()=>speak(s[0]); bindSlow($("#spcard"),s[0]); bindRecorder($("#spcard"),s[0]); $("#spt").onclick=()=>{$("#sptr").hidden=!$("#sptr").hidden}; speak(s[0]); }
  $("#spn").onclick=()=>{ i++; if(i%10===0) addXP(5); show(); };
  show();
}

  curAudio=a; a.__end=st+du; a.playbackRate=slow?.7:1; a.preservesPitch=true; a.webkitPreservesPitch=true;
  const fail=()=>{ if(curAudio===a){ curAudio=null; ttsSpeak(t,slow) } };
  a.onerror=fail;
  const go=()=>{ try{a.currentTime=st}catch(e){} const p=a.play(); if(p&&p.catch) p.catch(err=>{ if(!(err&&err.name==="AbortError")) fail() }) };
  if(a.readyState>=1) go(); else { a.addEventListener("loadedmetadata",go,{once:true}); try{a.load()}catch(e){fail()} }
}
const _speak0=speak;
speak=function(t,slow){
  if(S.useRec!==false&&!audioId(t)){ const sp=SPR[spKey(t)]; if(sp){
    const now=Date.now(); if(t===lastSpeak.t&&!!slow===lastSpeak.slow&&now-lastSpeak.at<1200) return;
    lastSpeak={t,slow:!!slow,at:now}; return playSprite(sp,slow,t); } }
  return _speak0(t,slow);
};

/* Banque : mots des leçons puis mots du LOD, du plus fréquent au moins fréquent */
function infItems(){
  const seen=new Set(), out=[];
  LESSONS.filter(l=>!l.review).forEach(l=>l.words.forEach(w=>{ if(!seen.has(w[0])){seen.add(w[0]); out.push({lb:w[0],fr:w[1]})} }));
  BANK.forEach(b=>{ if(!seen.has(b[0])){ seen.add(b[0]); out.push({lb:b[0],fr:b[{fr:2,en:3,pt:4,de:5}[LANG]]||b[2]}) } });
  return out;
}
const IV=[0,10*60e3,864e5,3*864e5,7*864e5,16*864e5,35*864e5];
function infSched(lb,ok){
  S.inf=S.inf||{}; const r=S.inf[lb]||{s:0,d:0};
  r.s=ok?Math.min(6,r.s+1):Math.max(0,r.s-2); r.d=Date.now()+IV[r.s]; S.inf[lb]=r;
}
function infStats(){
  const all=infItems(), inf=S.inf||{}, now=Date.now();
  return {learned:Object.values(inf).filter(r=>r.s>=2).length, due:Object.values(inf).filter(r=>r.d<=now).length, total:all.length};
}
/* Une phrase enregistrée qui contient ce mot (forme exacte) */
function exFor(lb){
  const core=lb.replace(/^(den|de|d')\s?/i,"").replace(/[?!.]/g,"").toLowerCase(); if(core.length<3||/\s/.test(core)) return null;
  const c=EXS.filter(x=>toks(x).some(tk=>tk.replace(/^d'/i,"").toLowerCase()===core)); return c.length?pick(c):null;
}
function startInf(){
  const all=infItems(), inf=S.inf||{}, now=Date.now();
  const due=all.filter(w=>inf[w.lb]&&inf[w.lb].d<=now).sort((a,b)=>inf[a.lb].d-inf[b.lb].d).slice(0,7);
  const fresh=all.filter(w=>!inf[w.lb]).slice(0,Math.max(3,8-due.length)).slice(0,5);
  let targets=due.concat(fresh);
  if(targets.length<6) targets=targets.concat(shuffle(all.filter(w=>inf[w.lb]&&!targets.includes(w))).slice(0,6-targets.length));
  const extra=shuffle(all.filter(w=>!targets.includes(w))).slice(0,8);
  const ex=[];
  fresh.forEach(w=>ex.push({t:"mcq",dir:"lb2fr",w,fresh:true}));
  const pairs=shuffle(targets).slice(0,5); if(pairs.length>=3) ex.push({t:"match",pairs});
  shuffle(targets).forEach((w,i)=>{
    const x=exFor(w.lb), opts=["fr2lb","listen","lb2fr"];
    if(x&&i%2===0) ex.push({t:"egap",w,x});
    else if(i%3===1&&w.lb.length<=16&&(audioId(w.lb)||SPR[spKey(w.lb)])) ex.push({t:"dict",w});
    else { const k=opts[i%3]; ex.push(k==="listen"&&canHear(w.lb)?{t:"listen",w}:{t:"mcq",dir:k==="listen"?"fr2lb":k,w}); }
  });
  const l={id:"inf",inf:true,level:"∞",unit:0,title:t("infTitle"),tip:"",words:targets.concat(extra).map(w=>[w.lb,w.fr]),sent:[],q:ex.slice(0,14)};
  startLesson(l);
}
function infCard(){
  const st=infStats();
  return `<section class="inf"><div class="inf-txt"><b><span aria-hidden="true">∞</span> ${esc(t("infT"))}</b><span>${esc(t("infP"))}</span><small>${esc(t("infStats",{a:st.learned,b:st.due,c:st.total}))}</small></div><button class="cta" id="inf-go">${esc(t("infGo"))}</button></section>`;
}
